services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      BIND_HOST: "0.0.0.0"
      ENVIRONMENT: local
      MODEL_STORAGE_DIRECTORY: /data/models
      OUTPUT_DIRECTORY: /data/generated
    volumes:
      - ./models:/data/models
      - ./generated:/data/generated
